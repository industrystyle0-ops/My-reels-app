<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTGRAM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
    
    /* Top Header */
    header { position: sticky; top: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.95); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
    .logo-text { font-size: 20px; font-weight: bold; letter-spacing: 1.5px; color: #fff; font-style: italic; }
    
    .nav-btn { background: #222; color: white; border: 1px solid #444; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .live-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border: none; }

    /* Bottom Navigation Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 55px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .bottom-nav button { background: none; border: none; color: #888; font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
    .bottom-nav button.active { color: #fff; }
    .bottom-nav button span { font-size: 9px; margin-top: 2px; }

    /* Modal / Popups */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; }
    .modal-content { background: #121212; padding: 22px; border-radius: 16px; width: 90%; max-width: 360px; text-align: center; border: 1px solid #333; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-content input, .modal-content textarea { width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1e1e1e; color: white; font-size: 14px; }
    .modal-content p { font-size: 12px; color: #aaa; margin-bottom: 8px; text-align: left; }

    /* Views / Pages */
    .app-view { display: none; width: 100vw; height: calc(100vh - 55px); overflow-y: auto; }
    .app-view.active { display: block; }

    /* Reels Feed View */
    #reelsView { padding-top: 0; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .reel-card { width: 100vw; height: calc(100vh - 55px); scroll-snap-align: start; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* Right Action Buttons */
    .reel-actions { position: absolute; right: 12px; bottom: 75px; display: flex; flex-direction: column; gap: 16px; align-items: center; z-index: 10; }
    .action-btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; font-size: 22px; cursor: pointer; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    .action-btn span { font-size: 11px; margin-top: 4px; font-weight: 600; }
    .action-btn.liked { color: #ff3040; }

    /* Bottom Left Info & Follow */
    .reel-details { position: absolute; left: 15px; bottom: 65px; z-index: 10; text-align: left; max-width: 75%; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .user-avatar-small { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #333; display: flex; align-items: center; justify-content: center; font-size: 14px; overflow: hidden; }
    .username { font-size: 15px; font-weight: bold; }
    .follow-btn { background: transparent; border: 1px solid #fff; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; }
    .follow-btn.following { background: #fff; color: #000; }
    .caption { font-size: 14px; line-height: 1.4; color: #f1f1f1; }

    /* Double Tap Heart Animation */
    .double-tap-heart { position: absolute; font-size: 90px; color: #ff3040; transform: scale(0); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease; pointer-events: none; z-index: 50; }
    .double-tap-heart.show { transform: scale(1); opacity: 1; }

    /* Generic Page Styling */
    .page-content { padding: 20px; text-align: center; }
    .page-content h2 { margin-bottom: 15px; color: #fff; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="logo-text">UTGRAM</div>
    <div class="top-actions">
      <button class="nav-btn live-btn" onclick="startLive()">🔴 Live</button>
    </div>
  </header>

  <!-- 1. REELS VIEW -->
  <div id="reelsView" class="app-view active">
    <div class="reels-container" id="reelsContainer"></div>
  </div>

  <!-- 2. HOME VIEW -->
  <div id="homeView" class="app-view">
    <div class="page-content" style="padding-bottom: 70px;">
      <h2>🏠 UTGRAM होम फीड</h2>
      <div id="homeReelsContainer" style="margin-top: 15px; display: flex; flex-direction: column; gap: 15px;"></div>
    </div>
  </div>

  <!-- 3. SEARCH VIEW -->
  <div id="searchView" class="app-view">
    <div class="page-content">
      <h2>🔍 खोजें (Explore)</h2>
      <input type="text" id="searchInput" placeholder="रील्स या यूज़र खोजें..." style="width: 100%; padding: 12px; border-radius: 8px; background: #1a1a1a; border: 1px solid #333; color: white; margin-top: 10px;" oninput="searchContent(this.value)">
      <div id="searchResults" style="margin-top: 20px; text-align: left; color: #aaa; font-size: 13px;"></div>
    </div>
  </div>

  <!-- 4. PROFILE VIEW -->
  <div id="profileView" class="app-view">
    <div class="page-content" style="padding-bottom: 70px;">
      <div id="profileAvatarContainer" style="width: 85px; height: 85px; background: #333; border-radius: 50%; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 38px; border: 2px solid #e1306c; overflow: hidden; position: relative;">
        <span id="profileAvatarIcon">👤</span>
        <img id="profileAvatarImg" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
      </div>
      <h2 id="profileNameDisplay">@Bharat_Creator</h2>
      <p id="profileBioDisplay" style="color:#aaa; font-size:13px; margin-bottom: 20px;">डिजिटल क्रिएटर | UTGRAM Official App 🚀</p>
      
      <div style="background: #161616; padding: 15px; border-radius: 12px; border: 1px solid #333; text-align: left;">
        <h4 style="margin-bottom: 10px; font-size: 14px; color: #fff;">प्रोफाइल एडिट करें:</h4>
        <p style="font-size:11px; color:#888; margin-bottom:4px;">प्रोफाइल फोटो चुनें:</p>
        <input type="file" id="editAvatarInput" accept="image/*" style="width:100%; padding:8px; margin-bottom:10px; background:#222; border:1px solid #444; color:#fff; border-radius:6px; font-size:12px;">
        <input type="text" id="editUsernameInput" placeholder="अपना यूजरनेम (जैसे: @Bharat)" style="width:100%; padding:10px; margin-bottom:10px; background:#222; border:1px solid #444; color:#fff; border-radius:6px;">
        <input type="text" id="editBioInput" placeholder="अपना बायो लिखें..." style="width:100%; padding:10px; margin-bottom:12px; background:#222; border:1px solid #444; color:#fff; border-radius:6px;">
        <button onclick="saveProfile()" style="background:#0095f6; color:#fff; border:none; width:100%; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">सेव करें</button>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px; color:#fff;">गैलरी से रील अपलोड करें</h3>
      <form id="uploadForm">
        <p>अपने फोन से वीडियो चुनें:</p>
        <input type="file" id="videoFileInput" accept="video/*" required style="padding: 8px;">
        <p style="margin-top: 10px;">कैप्शन लिखें:</p>
        <input type="text" id="captionInput" placeholder="अपनी रील के बारे में कुछ लिखें..." required>
        <button type="submit" id="uploadSubmitBtn" style="background:#0095f6; color:white; border:none; width:100%; margin-top:15px; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:14px;">पब्लिश करें</button>
        <button type="button" onclick="closeModal()" style="background:none; color:#aaa; border:none; margin-top:12px; cursor:pointer; font-size:13px;">रद्द करें</button>
      </form>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button onclick="switchTab('homeView', this)">🏠<span>होम</span></button>
    <button onclick="switchTab('searchView', this)">🔍<span>सर्च</span></button>
    <button onclick="openModal()" style="color:#0095f6;">➕<span>अपलोड</span></button>
    <button onclick="switchTab('reelsView', this)" class="active" id="reelsNavBtn">🎬<span>रील्स</span></button>
    <button onclick="switchTab('profileView', this)">👤<span>प्रोफाइल</span></button>
  </nav>

  <script>
    let currentUser = localStorage.getItem('utgram_user') || '@Bharat_Creator';
    let currentBio = localStorage.getItem('utgram_bio') || 'डिजिटल क्रिएटर | UTGRAM Official App 🚀';
    let currentAvatar = localStorage.getItem('utgram_avatar') || '';

    // Load saved profile data on startup
    document.getElementById('editUsernameInput').value = currentUser;
    document.getElementById('editBioInput').value = currentBio;
    document.getElementById('profileNameDisplay').textContent = currentUser;
    document.getElementById('profileBioDisplay').textContent = currentBio;

    if(currentAvatar) {
      document.getElementById('profileAvatarIcon').style.display = 'none';
      const avatarImg = document.getElementById('profileAvatarImg');
      avatarImg.src = currentAvatar;
      avatarImg.style.display = 'block';
    }

    function saveProfile() {
      const uInput = document.getElementById('editUsernameInput').value.trim();
      const bInput = document.getElementById('editBioInput').value.trim();
      const avatarFile = document.getElementById('editAvatarInput').files[0];

      if(uInput) {
        currentUser = uInput.startsWith('@') ? uInput : '@' + uInput;
        currentBio = bInput || currentBio;
        localStorage.setItem('utgram_user', currentUser);
        localStorage.setItem('utgram_bio', currentBio);

        document.getElementById('profileNameDisplay').textContent = currentUser;
        document.getElementById('profileBioDisplay').textContent = currentBio;

        if(avatarFile) {
          const reader = new FileReader();
          reader.onload = function(e) {
            currentAvatar = e.target.result;
            localStorage.setItem('utgram_avatar', currentAvatar);
            document.getElementById('profileAvatarIcon').style.display = 'none';
            const avatarImg = document.getElementById('profileAvatarImg');
            avatarImg.src = currentAvatar;
            avatarImg.style.display = 'block';
            alert('प्रोफाइल और फोटो सफलतापूर्वक अपडेट हो गए!');
            loadReels();
          };
          reader.readAsDataURL(avatarFile);
        } else {
          alert('प्रोफाइल सफलतापूर्वक अपडेट हो गई!');
          loadReels();
        }
      }
    }

    function switchTab(viewId, btn) {
      document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      
      document.querySelectorAll('.bottom-nav button').forEach(b => {
        if(b.onclick && !b.onclick.toString().includes('openModal')) {
          b.classList.remove('active');
        }
      });
      if(btn && !btn.onclick.toString().includes('openModal')) {
        btn.classList.add('active');
      }

      if(viewId === 'homeView') {
        loadHomeFeed();
      }
    }

    function openModal() { 
      document.getElementById('uploadModal').style.display = 'flex'; 
    }
    
    function closeModal() { 
      document.getElementById('uploadModal').style.display = 'none'; 
    }

    function startLive() {
      alert('🔴 लाइव ब्रॉडकास्ट मोड शुरू हो रहा है!');
      navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => { alert('आप लाइव हैं!'); })
        .catch(err => { alert('कैमरा और माइक की अनुमति चाहिए।'); });
    }

    let globalReels = [];

    async function loadReels() {
      try {
        const res = await fetch('/api/reels');
        globalReels = await res.json();
        const container = document.getElementById('reelsContainer');

        if(!globalReels || globalReels.length === 0) {
          container.innerHTML = `<div style="padding-top:200px; text-align:center; color:#888; padding:20px;">कोई रील नहीं मिली।<br>नीचे ➕ अपलोड बटन से वीडियो जोड़ें!</div>`;
          return;
        }

        container.innerHTML = globalReels.map((r) => `
          <div class="reel-card" onclick="handleVideoClick(event, this)">
            <video src="${r.videoUrl}" loop playsinline preload="auto"></video>
            <div class="double-tap-heart">❤️</div>
            
            <div class="reel-actions">
              <button class="action-btn ${r.likedByMe ? 'liked' : ''}" onclick="event.stopPropagation(); toggleLike(${r.id}, this)">
                ❤️ <span class="like-count" style="font-size:11px;">${r.likes}</span>
              </button>
              <button class="action-btn" onclick="event.stopPropagation(); alert('कमेंट्स बॉक्स खुल रहा है!')">
                💬 <span style="font-size:11px;">18</span>
              </button>
              <button class="action-btn" onclick="event.stopPropagation(); shareReel()">
                🚀 <span style="font-size:11px;">शेयर</span>
              </button>
              <button class="action-btn" onclick="event.stopPropagation(); alert('रील सेव हो गई!')">
                🔖 <span style="font-size:11px;">सेव</span>
              </button>
            </div>

            <div class="reel-details" onclick="event.stopPropagation()">
              <div class="user-row">
                <div class="user-avatar-small">
                  ${r.userAvatar ? `<img src="${r.userAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : '👤'}
                </div>
                <span class="username">${r.username}</span>
                <button class="follow-btn" onclick="toggleFollow(this)">फॉलो करें</button>
              </div>
              <div class="caption">${r.caption}</div>
            </div>
          </div>
        `).join('');

        setupVideoObserver();
      } catch (err) {
        console.log('Error loading reels');
      }
    }

    function loadHomeFeed() {
      const homeContainer = document.getElementById('homeReelsContainer');
      if(!globalReels || globalReels.length === 0) {
        homeContainer.innerHTML = `<p style="color:#777; font-size:13px; text-align:center; margin-top:20px;">होम फीड पर दिखाने के लिए कोई पोस्ट नहीं है।</p>`;
        return;
      }

      homeContainer.innerHTML = globalReels.map(r => `
        <div style="background:#111; border:1px solid #222; border-radius:12px; overflow:hidden; margin-bottom:15px;">
          <div style="padding:10px 12px; display:flex; align-items:center; gap:10px;">
            <div style="width:30px; height:30px; border-radius:50%; background:#333; overflow:hidden; display:flex; align-items:center; justify-content:center;">
              ${r.userAvatar ? `<img src="${r.userAvatar}" style="width:100%;height:100%;object-fit:cover;">` : '👤'}
            </div>
            <span style="font-size:13px; font-weight:bold; color:#fff;">${r.username}</span>
          </div>
          <video src="${r.videoUrl}" controls style="width:100%; max-height:350px; object-fit:cover; background:#000;"></video>
          <div style="padding:10px 12px; font-size:13px; color:#ddd;">${r.caption}</div>
        </div>
      `).join('');
    }

    function searchContent(query) {
      const resultsDiv = document.getElementById('searchResults');
      if(!query.trim()) {
        resultsDiv.innerHTML = '';
        return;
      }
      const filtered = globalReels.filter(r => r.caption.toLowerCase().includes(query.toLowerCase()) || r.username.toLowerCase().includes(query.toLowerCase()));
      if(filtered.length === 0) {
        resultsDiv.innerHTML = '<p style="color:#666;">कोई परिणाम नहीं मिला।</p>';
        return;
      }
      resultsDiv.innerHTML = filtered.map(r => `
        <div style="background:#141414; padding:10px; border-radius:8px; margin-bottom:8px; border:1px solid #262626;">
          <span style="color:#fff; font-weight:bold; font-size:13px;">${r.username}</span>
          <p style="color:#aaa; font-size:12px; margin-top:4px;">${r.caption}</p>
        </div>
      `).join('');
    }

    let lastClickTime = 0;
    function handleVideoClick(e, card) {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastClickTime;
      const video = card.querySelector('video');
      const heart = card.querySelector('.double-tap-heart');

      if (tapLength < 300 && tapLength > 0) {
        heart.classList.add('show');
        setTimeout(() => heart.classList.remove('show'), 600);
        const likeBtn = card.querySelector('.action-btn');
        if (!likeBtn.classList.contains('liked')) {
          likeBtn.click();
        }
        e.preventDefault();
      } else {
        if (video.paused) video.play();
        else video.pause();
      }
      lastClickTime = currentTime;
    }

    async function toggleLike(id, btn) {
      try {
        const res = await fetch('/api/reels/like', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if(data.success) {
          const countSpan = btn.querySelector('.like-count');
          countSpan.textContent = data.likes;
          if(data.likedByMe) {
            btn.classList.add('liked');
          } else {
            btn.classList.remove('liked');
          }
        }
      } catch(err) {
        console.log('Like error');
      }
    }

    function setupVideoObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (entry.isIntersecting) { video.play().catch(e => {}); } 
          else { video.pause(); }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.reel-card').forEach(card => observer.observe(card));
    }

    function toggleFollow(btn) {
      if (btn.classList.contains('following')) {
        btn.classList.remove('following');
        btn.textContent = 'फॉलो करें';
      } else {
        btn.classList.add('following');
        btn.textContent = 'फॉलोइंग ✓';
      }
    }

    function shareReel() {
      if (navigator.share) {
        navigator.share({ title: 'UTGRAM Reel', url: window.location.origin }).catch(e => {});
      } else {
        alert('रील लिंक कॉपी हो गया!');
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('videoFileInput');
      const caption = document.getElementById('captionInput').value;
      const submitBtn = document.getElementById('uploadSubmitBtn');

      if(fileInput.files.length === 0) {
        alert('कृपया वीडियो चुनें!');
        return;
      }

      const file = fileInput.files[0];
      submitBtn.textContent = 'अपलोड हो रहा है...';
      submitBtn.disabled = true;

      const videoUrl = URL.createObjectURL(file);

      try {
        const response = await fetch('/api/reels', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body
